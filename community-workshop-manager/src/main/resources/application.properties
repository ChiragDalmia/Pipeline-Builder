spring.application.name=community-workshop-manager

# JSP views live in src/main/webapp/WEB-INF/jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.context-parameters.defaultHtmlEscape=true

server.port=8080
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.tracking-modes=cookie

# Persistent local database stored in ./data (relative to the working directory).
# Delete the ./data folder to reset to the sample data.
app.db.path=./data/community-workshops
spring.datasource.url=jdbc:h2:file:${app.db.path};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Load ten instructors and ten workshops when the database is empty.
app.seed-data=true
